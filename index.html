:root{
  --bg:#04071A; --surface:#0A0F2C; --surface-2:#121941; --ink:#F2F4FF; --muted:#8A93C9; --line:#1C2352;
  --studio:#02040F; --panel:#0A0F2E; --hair:rgba(255,255,255,.09); --text:#F2F4FF; --dim:#8A93C9;
  --t1:#2A50F5; --t2:#1537CF; --t3:#0A1D90;
  --g1:#FFF5CC; --g2:#FFD553; --g3:#E09E14;
  --blue:#1E3FE6; --ok:#26D07C; --bad:#FF5F5F; --live:#FF3448;
  --gold-grad:linear-gradient(180deg,var(--g1) 0%,var(--g2) 38%,var(--g3) 72%,#FFE59A 100%);
  --tile-grad:linear-gradient(180deg,var(--t1) 0%,var(--t2) 46%,var(--t3) 100%);
  --fd:"BSD","Arial Narrow","Roboto Condensed",sans-serif;
  --f:"Inst",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{--bg:#F3F4F9;--surface:#FFFFFF;--surface-2:#E9EBF5;--ink:#0A0E2A;--muted:#5C6390;--line:#DDE0EE}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:radial-gradient(80% 50% at 50% -10%,rgba(32,72,255,.16),transparent 70%) no-repeat,var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--f);min-height:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem 1rem;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px rgba(30,63,230,.28)}
.btn.primary:hover{background:#2B4BF0}
.btn.gold{background:var(--gold-grad);border-color:transparent;color:#2A1C00;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 20px rgba(255,190,40,.25)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.big{font-size:1.05rem;padding:.85rem 1.7rem;border-radius:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);margin:.8rem 0 0}

/* wordmark */
.mark{display:inline-flex;align-items:center;gap:.6rem;font:800 1.45rem/1 var(--fd);letter-spacing:.01em}
.mark .glyph{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.mark .glyph i{width:7px;height:5px;border-radius:1px;background:var(--tile-grad)}
.mark .glyph i:nth-child(5){background:var(--gold-grad)}
.mark small{font:600 .72rem/1 var(--f);letter-spacing:.02em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.28rem .5rem}

/* library */
.page{max-width:1120px;margin:0 auto;padding:1.5rem 1.3rem 4rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:3rem}
.sync{color:var(--muted);font-size:.82rem}
h1{font:800 clamp(2.8rem,6.5vw,4.6rem)/.9 var(--fd);letter-spacing:-.005em;margin:0}
h2{font:650 1.12rem/1.2 var(--f);margin:0;letter-spacing:-.01em}
.lib-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.games{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1rem}
.game{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.7rem .7rem 1rem;display:flex;flex-direction:column;gap:.9rem;transition:transform .2s,box-shadow .2s}
.game:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(0,0,0,.3),0 0 0 1px rgba(255,213,83,.18)}
.game > div:not(.mini),.game .row{padding:0 .35rem}
.mini{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px;aspect-ratio:16/7.5;background:radial-gradient(90% 90% at 50% 20%,#0B1650,var(--studio));border-radius:12px;padding:8px}
.mini span{background:var(--tile-grad);border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.mini span.h{background:linear-gradient(#132A9E,#0B1A6E);border-bottom:2px solid var(--g2)}
.mini span.e{background:#0A1250;box-shadow:none}
.game .btn{padding:.5rem .85rem}
.game .btn.ghost{padding:.5rem .55rem}
.game p{margin:.2rem 0 0;color:var(--muted);font-size:.88rem}
.game .row{margin-top:auto}
.resume{background:radial-gradient(120% 140% at 0% 0%,#1A2F9E 0%,#070C2C 60%);color:var(--text);border-radius:18px;padding:1.1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.8rem;box-shadow:inset 0 0 0 1px var(--hair)}
.resume b{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.resume .btn.ghost{color:var(--dim)}
.resume .btn.ghost:hover{background:rgba(255,255,255,.06);color:#fff}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:3rem;text-align:center;color:var(--muted)}
.help{margin-top:3.5rem;padding-top:2rem;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.8rem;color:var(--muted);font-size:.93rem}
.help h3{color:var(--ink);font:650 1rem var(--f);margin:0 0 .35rem}
.help p{margin:0;max-width:52ch}
.linkbtn{background:none;border:0;padding:0;color:var(--g2);font-weight:600;cursor:pointer;font-size:.93rem}

/* editor */
.ed-top{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.title-in{flex:1;min-width:220px;font:800 clamp(2rem,4.6vw,3rem)/1.05 var(--fd);background:transparent;border:0;border-bottom:2px solid transparent;padding:.1rem 0}
.title-in:hover{border-color:var(--line)}
.title-in:focus{outline:none;border-color:var(--blue)}
.settings{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.2rem 0 1.5rem;color:var(--muted);font-size:.9rem;align-items:center}
.settings label{display:flex;gap:.45rem;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--blue);width:1rem;height:1rem}
.tabs{display:inline-flex;gap:.2rem;background:var(--surface-2);padding:.25rem;border-radius:12px;margin-bottom:1rem;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;padding:.5rem 1rem;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;border-radius:9px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ed-scroll{overflow-x:auto;padding-bottom:.5rem}
.ed-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(150px,1fr));gap:7px;background:radial-gradient(100% 80% at 50% 0%,#0B1650,var(--studio));padding:12px;border-radius:18px;min-width:min-content;box-shadow:0 20px 50px rgba(10,20,80,.18)}
.cat-in{width:100%;background:linear-gradient(180deg,#132A9E,#0B1A6E);color:#fff;border:0;border-bottom:3px solid var(--g2);border-radius:7px 7px 3px 3px;padding:.7rem .5rem .6rem;text-align:center;font:800 1.08rem/1.1 var(--fd);text-transform:uppercase;letter-spacing:.03em;min-height:3.5rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.cat-in:focus{outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 2px var(--g2)}
.cat-in::placeholder{color:#7482D6;text-transform:none;font-family:var(--f);font-weight:500;font-size:.9rem;letter-spacing:0}
.ed-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;width:100%;min-height:5.4rem;background:var(--tile-grad);border:0;border-radius:7px;color:#fff;cursor:pointer;padding:.5rem;position:relative;margin-top:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 0 0 1px rgba(140,170,255,.22),inset 0 -10px 22px rgba(0,0,20,.3);transition:filter .15s}
.ed-card:hover{filter:brightness(1.15)}
.ed-card .v{font:900 1.6rem/1 var(--fd);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.ed-card .p{font-size:.74rem;line-height:1.25;color:#CBD3FF;max-height:2.5em;overflow:hidden;text-align:center}
.ed-card:not(.filled){background:#0A1250;box-shadow:inset 0 0 0 1px rgba(120,140,255,.15)}
.ed-card:not(.filled) .v{background:none;color:#4B57A6;filter:none}
.ed-card:not(.filled) .p{color:#6572C0}
.dd{position:absolute;top:5px;right:5px;background:var(--gold-grad);color:#2A1C00;font:800 .66rem/1 var(--f);padding:3px 6px;border-radius:5px;letter-spacing:.04em}
.ed-foot{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:1.1rem;align-items:center}
select.btn{appearance:auto;padding-right:.7rem}
.field{display:grid;gap:.35rem;margin-bottom:1rem}
.field span{font-weight:600;font-size:.85rem;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.7rem .85rem}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,63,230,.16)}
.field textarea{min-height:6.5rem;resize:vertical;font-size:1.05rem;line-height:1.45}
.final-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem;max-width:720px}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(2,4,15,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:1rem;z-index:60;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:1.5rem 1.5rem 1.2rem;box-shadow:0 40px 100px rgba(0,0,0,.45);border:1px solid var(--line);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.modal h2{font:800 1.7rem/1.1 var(--fd);margin-bottom:1.1rem;letter-spacing:.01em}
.modal .foot{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.two{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end}
.dark-modal .modal{background:radial-gradient(120% 90% at 50% 0%,#0F1B6A,var(--panel));color:var(--text);border-color:var(--hair)}

/* setup */
.setup{display:grid;grid-template-columns:1fr 1.2fr;gap:1.2rem}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.4rem}
.panel h2{margin-bottom:1rem}
.team-row{display:flex;gap:.55rem;align-items:center;margin-bottom:.55rem}
.swatch{width:1.6rem;height:1.6rem;border-radius:50%;flex:none;border:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12),0 0 0 3px var(--surface-2)}
.dot{width:.55rem;height:.55rem;border-radius:50%;display:inline-block;flex:none}
.team-row input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.65rem .85rem;font-weight:600}
.join{background:radial-gradient(120% 100% at 100% 0%,#13248A 0%,#070B28 55%);color:var(--text);border:0;box-shadow:inset 0 0 0 1px var(--hair),0 24px 60px rgba(8,14,60,.3)}
.join .joinbox{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
@media (max-width:480px){.join .joinbox{grid-template-columns:1fr}}
.qr{background:#fff;border-radius:14px;padding:11px;width:156px;height:156px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.qr svg{width:100%;height:100%}
.code{font:900 clamp(3rem,7vw,4.4rem)/.95 var(--fd);letter-spacing:.14em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.codelabel{color:var(--dim);font-size:.82rem;margin-bottom:.35rem}
.joinurl{font-size:.78rem;color:var(--dim);word-break:break-all;margin:.6rem 0 .8rem}
.join .btn{background:rgba(255,255,255,.06);border-color:var(--hair);color:var(--text)}
.join .btn:hover{background:rgba(255,255,255,.1)}
.status{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--dim);border:1px solid var(--hair);border-radius:999px;padding:.25rem .65rem}
.status .dot{background:#666}
.status.on .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.wait .dot{background:var(--g2)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.2rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.06);border:1px solid var(--hair);border-radius:999px;padding:.32rem .75rem .32rem .6rem;font-size:.86rem;animation:pop .25s ease-out}
.chip em{font-style:normal;color:var(--dim)}

/* ================= STAGE ================= */
.stage{position:fixed;inset:0;color:var(--text);display:grid;grid-template-rows:auto 1fr auto;z-index:10;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background:radial-gradient(70% 55% at 50% 40%,rgba(32,72,255,.22),transparent 72%),radial-gradient(120% 60% at 50% 110%,rgba(255,200,70,.06),transparent 60%),linear-gradient(180deg,#060B28 0%,var(--studio) 100%)}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1.4rem .6rem}
.stagebar .mark{font-size:1.2rem;color:#fff}
.stagebar .mark small{color:var(--dim);border-color:var(--hair)}
.sbtn,.stagebar .btn,.ctrl .btn{background:rgba(255,255,255,.045);border:1px solid var(--hair);color:#DDE2FF;border-radius:9px;padding:.42rem .85rem;font-size:.84rem;font-weight:600}
.stagebar .btn:hover,.ctrl .btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
.pill{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--hair);border-radius:9px;padding:.42rem .8rem;font-size:.84rem;color:var(--dim);background:rgba(255,255,255,.03);cursor:pointer;font-weight:500}
.pill b{font:800 1rem/1 var(--fd);letter-spacing:.12em;color:var(--g2)}
.stagemain{position:relative;min-height:0;padding:0 1.4rem}

.bezel{height:100%;padding:clamp(6px,.75vw,12px);border-radius:18px;background:linear-gradient(180deg,#0B1133,#03061A);
  box-shadow:0 0 0 1px rgba(255,213,83,.16),inset 0 1px 0 rgba(255,255,255,.06),0 40px 120px rgba(10,40,255,.22)}
.board{height:100%;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:minmax(3.8rem,.82fr) repeat(var(--rows),1fr);gap:clamp(4px,.55vw,9px)}
.bcat{display:grid;place-items:center;text-align:center;padding:.35rem .6rem;background:linear-gradient(180deg,#142CA6 0%,#0B1A6E 100%);border-radius:8px 8px 4px 4px;border-bottom:3px solid var(--g2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(140,170,255,.18),0 6px 18px rgba(255,200,60,.08);
  font:800 clamp(.9rem,1.85vw,1.95rem)/1.02 var(--fd);text-transform:uppercase;letter-spacing:.035em;text-shadow:0 2px 0 rgba(0,0,0,.55);overflow:hidden}
.tile{position:relative;overflow:hidden;background:var(--tile-grad);border:0;border-radius:6px;display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(140,170,255,.22),inset 0 -14px 28px rgba(0,0,30,.34);transition:filter .2s,transform .2s}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-130%);transition:transform .7s ease}
.tile:hover:not(:disabled){filter:brightness(1.14)}
.tile:hover:not(:disabled)::after{transform:translateX(130%)}
.tile:disabled{cursor:default;background:linear-gradient(180deg,#0A1250,#060B36);box-shadow:inset 0 0 0 1px rgba(120,140,255,.08)}
.tile:disabled::after{display:none}
.val{font:900 clamp(1.7rem,5.2vw,5.4rem)/1 var(--fd);letter-spacing:.01em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(255,190,50,.22))}
.board.intro .tile,.board.intro .bcat{animation:tileIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) * 32ms)}
@keyframes tileIn{from{opacity:0;transform:perspective(600px) rotateX(-70deg);filter:brightness(2)}to{opacity:1;transform:none}}
.round-done{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,4,15,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px}
.round-done div{text-align:center}
.round-done h2{font:900 clamp(2.6rem,7vw,6rem)/1 var(--fd);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));margin-bottom:1.4rem}

.clue{height:100%;display:grid;grid-template-columns:1fr minmax(230px,22%);gap:1rem}
@media (max-width:760px){.clue{grid-template-columns:1fr;grid-template-rows:1fr auto}}
.face{position:relative;border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1.4rem,4.5vw,5rem);text-align:center;overflow:auto;min-height:0;
  background:radial-gradient(120% 90% at 50% 0%,#2E52F4 0%,#1535CC 45%,#0A1C8C 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 0 0 1px rgba(140,170,255,.24),0 0 0 1px rgba(255,213,83,.14),0 40px 120px rgba(10,40,255,.28);
  transition:box-shadow .3s;animation:faceIn .38s cubic-bezier(.2,.8,.2,1)}
.face.plain{background:transparent;box-shadow:none}
.face.lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 0 0 1px rgba(140,170,255,.24),0 0 0 3px var(--lit),0 0 90px color-mix(in srgb,var(--lit) 50%,transparent)}
@keyframes faceIn{from{opacity:0;transform:scale(.9);filter:brightness(1.6)}to{opacity:1;transform:none;filter:none}}
.meta{display:inline-flex;gap:.8rem;align-items:center;margin-bottom:clamp(1.2rem,3vw,2.8rem)}
.meta span{font:800 clamp(1rem,1.9vw,1.8rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.07em;color:rgba(230,236,255,.82)}
.meta b{font:900 clamp(1rem,1.9vw,1.8rem)/1 var(--fd);letter-spacing:.03em;background:var(--gold-grad);color:#2A1C00;padding:.35rem .7rem .3rem;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.ctext{font:700 clamp(1.6rem,4vw,4.3rem)/1.2 var(--f);text-transform:uppercase;letter-spacing:.015em;max-width:24ch;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 40px rgba(0,10,80,.4)}
.answer{margin-top:clamp(1.4rem,3.4vw,3rem);font:900 clamp(1.8rem,4vw,4rem)/1.1 var(--fd);letter-spacing:.02em;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));visibility:hidden;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
.answer::before{content:"";display:block;width:64px;height:3px;margin:0 auto clamp(1rem,2vw,1.6rem);background:var(--gold-grad);border-radius:2px}
.answer.on{visibility:visible;opacity:1;transform:none}
.bigword{font:900 clamp(3.4rem,11vw,10rem)/.88 var(--fd);letter-spacing:.01em;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.5)) drop-shadow(0 0 40px rgba(255,190,50,.3))}

/* daily double */
.ddstage{position:relative;height:100%;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;
  background:radial-gradient(60% 60% at 50% 45%,#1E3FE6 0%,#0A1A7E 55%,#040A36 100%);box-shadow:0 0 0 1px rgba(255,213,83,.25),0 40px 120px rgba(255,190,50,.12)}
.ddstage::before{content:"";position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(from 0deg,rgba(255,213,83,.07) 0deg 5deg,transparent 5deg 12deg);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ddstage > *{position:relative}
.ddstage .bigword{animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
.ddstage .who{margin-top:2.2rem;font:600 1rem var(--f);color:#C9D1FF;margin-bottom:.9rem}
.choose{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.choose button{display:inline-flex;align-items:center;gap:.5rem;background:rgba(2,4,20,.45);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:.6rem 1rem;font-weight:600;cursor:pointer}
.choose button.sel{background:var(--gold-grad);color:#2A1C00;border-color:transparent}

/* buzz panel */
.buzz{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--hair);border-radius:18px;padding:1.1rem;display:flex;flex-direction:column;min-height:0;overflow:auto}
.buzz h3{margin:0 0 .35rem;font:800 1.35rem/1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.bstat{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--dim);margin:0 0 1rem}
.bstat .dot{background:#4A5080}
.bstat.open{color:#9FF3C4}.bstat.open .dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.queue{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.queue li{display:flex;gap:.7rem;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:12px;padding:.6rem .75rem;font-weight:600;animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}}
.queue li:first-child{background:var(--gold-grad);border-color:transparent;color:#2A1C00;box-shadow:0 8px 30px rgba(255,190,50,.25)}
.queue li.out{opacity:.35;text-decoration:line-through}
.queue .n{font:900 1.6rem/1 var(--fd);width:1.3rem;text-align:center}
.queue small{font-weight:500;opacity:.75;display:block;font-size:.78rem}
.hint{color:var(--dim);margin:0;font-size:.86rem;line-height:1.45}
.answering{border-radius:14px;padding:1rem;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#0A0F2E),#0A0F2E);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--c) 25%,transparent);animation:pop .25s ease-out}
.answering .lab{font-size:.78rem;color:var(--dim);margin-bottom:.2rem}
.answering .tn{font:900 clamp(1.8rem,2.6vw,2.6rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;color:var(--c)}
.answering .pn{font-weight:600;margin-top:.2rem}
.answering .btn{flex:1;border-radius:10px;padding:.6rem .5rem;font-weight:700}
.answering .btn.ok{background:var(--ok);color:#01200F;border-color:transparent}
.answering .btn.no{background:var(--bad);color:#2A0000;border-color:transparent}
.elig{display:flex;flex-wrap:wrap;gap:.35rem}
.elig .chip{background:rgba(255,255,255,.06)}
.log{list-style:none;margin:1rem 0 0;padding:.8rem 0 0;border-top:1px solid var(--hair);display:grid;gap:.35rem}
.log li{display:flex;align-items:center;gap:.55rem;font-size:.86rem}
.log li span:nth-child(2){flex:1}
.log small{color:var(--dim);margin-left:.4rem}
.log b{font-weight:700;font-size:.78rem}
.log li.wrong b{color:var(--bad)}
.log li.right b{color:var(--ok)}

/* host dock */
.ctrl{margin:.8rem 1.4rem 0;padding:.5rem .55rem;display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center;background:rgba(10,15,46,.7);border:1px solid var(--hair);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ctrl .btn.gold{background:var(--gold-grad);border-color:transparent;color:#2A1C00}
.ctrl .btn.on{background:var(--ok);border-color:transparent;color:#01200F}
.judge{display:flex;gap:.4rem;flex-wrap:wrap}
.jteam{display:flex;align-items:center;gap:.2rem;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:10px;padding:.2rem .2rem .2rem .65rem;font-weight:600;font-size:.86rem}
.jteam .dot{margin-right:.25rem}
.jteam .btn{padding:.28rem .62rem;font-size:.9rem;border-radius:7px;margin-left:.15rem}
.jteam .btn.yes.sel{background:var(--ok);border-color:transparent;color:#01200F}
.jteam .btn.no.sel{background:var(--bad);border-color:transparent;color:#2A0000}
kbd{font:600 .68rem var(--f);color:var(--dim);border:1px solid var(--hair);border-radius:4px;padding:.02rem .3rem;margin-left:.1rem}
.btn.gold kbd,.btn.on kbd{color:inherit;border-color:currentColor;opacity:.55}

/* team podiums */
.scores{display:grid;grid-template-columns:repeat(var(--n),minmax(130px,1fr));gap:clamp(8px,.9vw,14px);padding:.8rem 1.4rem 1.1rem;overflow-x:auto}
.pod{position:relative;border-radius:14px;padding:.55rem .6rem .6rem;background:linear-gradient(180deg,#0E1542,#060A26);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.07),0 14px 30px rgba(0,0,0,.35)}
.pod::before{content:"";position:absolute;left:14%;right:14%;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--c);box-shadow:0 0 14px var(--c),0 0 30px var(--c)}
.pod .nm{display:flex;justify-content:center;align-items:baseline;gap:.4rem;font:800 clamp(.9rem,1.35vw,1.3rem)/1.1 var(--fd);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.1rem 1.6rem .4rem}
.pod .nm small{font:500 .7rem var(--f);letter-spacing:0;text-transform:none;color:var(--dim)}
.pod .screen{border-radius:9px;text-align:center;padding:.1rem 0 .05rem;background:linear-gradient(180deg,#1332C4,#081A7A);box-shadow:inset 0 2px 10px rgba(0,0,20,.55),inset 0 0 0 1px rgba(140,170,255,.25)}
.pod .pts{font:900 clamp(1.7rem,3.3vw,3.2rem)/1.08 var(--fd);letter-spacing:.02em;color:#fff;text-shadow:0 0 16px rgba(170,195,255,.7)}
.pod.lead .pts{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 12px rgba(255,190,50,.35))}
.pod .pts.neg{color:#FF8A8A;text-shadow:0 0 14px rgba(255,90,90,.5)}
.pod .adj{position:absolute;top:.4rem;right:.4rem;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.pod:hover .adj,.pod:focus-within .adj{opacity:1}
.pod .adj button{background:rgba(255,255,255,.08);border:1px solid var(--hair);color:#fff;border-radius:6px;width:1.6rem;height:1.5rem;cursor:pointer;font-weight:700;font-size:.85rem;line-height:1}
.pod.bump .screen{animation:bump .5s ease-out}
@keyframes bump{30%{filter:brightness(1.8)}}

.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;width:min(940px,100%);margin-top:1.8rem}
.wagers label{background:rgba(2,4,20,.35);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:.9rem 1rem;display:grid;gap:.45rem;text-align:left;font:800 1.2rem var(--fd);text-transform:uppercase;letter-spacing:.04em}
.wagers input{background:#fff;color:#0A0E2A;border:0;border-radius:9px;padding:.55rem .7rem;font:900 1.5rem var(--fd);width:100%}
.wagers small{font:500 .8rem var(--f);color:#C3CBFF;text-transform:none;letter-spacing:0}
.timer{font:900 clamp(2.4rem,6vw,5rem) var(--fd);color:#fff;margin-top:1.2rem;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(170,195,255,.6)}
.podium{display:grid;gap:.6rem;width:min(660px,100%);margin-top:2rem}
.podium div{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:14px;padding:.8rem 1.2rem;font:800 clamp(1.3rem,2.6vw,2.2rem) var(--fd);text-transform:uppercase;letter-spacing:.04em;animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 120ms)}
.podium div:first-child{background:var(--gold-grad);color:#2A1C00;border-color:transparent;box-shadow:0 12px 40px rgba(255,190,50,.3)}

/* ================= PLAYER ================= */
.player{min-height:100vh;min-height:100dvh;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:1.1rem 1.2rem 2rem;
  background:radial-gradient(90% 50% at 50% 42%,rgba(32,72,255,.22),transparent 70%),linear-gradient(180deg,#060B28,var(--studio))}
.ptop{width:min(460px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.ptop .mark{color:#fff}
.ptop .mark small{color:var(--dim);border-color:var(--hair)}
.pcard{width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center}
.pcard h1{font-size:clamp(2.6rem,12vw,3.4rem)}
.pcard input{width:100%;border:1px solid var(--hair);border-radius:14px;padding:.95rem 1rem;font-size:1.1rem;font-weight:600;color:var(--text);background:rgba(255,255,255,.05)}
.pcard input:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(255,213,83,.15)}
.pcard input.codein{text-align:center;font:900 2.6rem var(--fd);letter-spacing:.2em;text-transform:uppercase;padding:.6rem}
.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;width:100%}
.teamgrid button{position:relative;overflow:hidden;border:1px solid var(--hair);background:rgba(255,255,255,.04);color:var(--text);border-radius:14px;padding:1.05rem .6rem;font:800 1.2rem/1 var(--fd);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem}
.teamgrid button::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.teamgrid button[aria-pressed="true"]{background:rgba(255,255,255,.1);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px color-mix(in srgb,var(--c) 35%,transparent)}
.whoami{display:inline-flex;align-items:center;gap:.55rem;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:999px;padding:.45rem 1rem;font-weight:600}
.ring{width:min(80vw,340px);aspect-ratio:1;border-radius:50%;padding:clamp(12px,3.5vw,16px);background:linear-gradient(150deg,#3A4178,#0A0E2A 60%);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.5)}
.buzzer{position:relative;width:100%;height:100%;border-radius:50%;border:0;font:900 clamp(3rem,15vw,5.2rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  color:#4A5390;background:radial-gradient(circle at 50% 32%,#252D5E,#0E1234 72%);box-shadow:inset 0 -10px 24px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.07);transition:transform .08s}
.buzzer::before{content:"";position:absolute;left:22%;right:22%;top:7%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));opacity:.25;pointer-events:none}
.buzzer.live{color:#fff;text-shadow:0 3px 0 rgba(120,0,15,.5);background:radial-gradient(circle at 50% 30%,#FF8C95 0%,#FF3448 36%,#C8102A 74%,#86071A 100%);box-shadow:inset 0 -14px 30px rgba(60,0,10,.45),inset 0 3px 0 rgba(255,255,255,.3)}
.buzzer.live::before{opacity:1}
.ring.live{animation:ringPulse 1.2s ease-out infinite}
@keyframes ringPulse{0%{box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2),0 0 0 0 rgba(255,52,72,.55)}100%{box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2),0 0 0 30px rgba(255,52,72,0)}}
.buzzer.live:active{transform:scale(.965)}
.buzzer.hit{color:#2A1C00;background:radial-gradient(circle at 50% 30%,#FFF3C4 0%,#FFD553 40%,#E09E14 80%,#A86F05 100%);box-shadow:inset 0 -14px 30px rgba(90,50,0,.35),inset 0 3px 0 rgba(255,255,255,.55)}
.buzzer.hit::before{opacity:1}
.ring.hit{box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 80px rgba(255,190,50,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.buzzer.out{color:#6E4A55;background:radial-gradient(circle at 50% 32%,#2A1622,#12080E 72%)}
.buzzer:disabled{cursor:default}
.steal{width:min(58vw,230px);padding:.85rem 1rem;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.04);color:#4A5390;font:900 1.5rem/1 var(--fd);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.steal:disabled{cursor:default}
.steal.live{color:#2A1300;border-color:transparent;background:linear-gradient(180deg,#FFC04D,#F07A0C);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 0 0 0 rgba(240,122,12,.6);animation:stealPulse 1.1s ease-out infinite}
.steal.live:active{transform:scale(.96)}
@keyframes stealPulse{to{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 0 0 18px rgba(240,122,12,0)}}
.psub{margin:-.4rem 0 0;color:var(--dim);font-size:.88rem;min-height:1.2em}
.ddnote{margin:.8rem 0 0;font-weight:600;color:#FFE08A}
.rules{margin-top:1.6rem;padding-top:1.3rem;border-top:1px solid var(--line)}
.rule{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;cursor:pointer}
.rule input{margin-top:.2rem;flex:none}
.rule b{display:block;font-weight:600}
.rule small{display:block;color:var(--muted);font-size:.84rem;line-height:1.4}
.pmsg{font:800 1.55rem/1.15 var(--fd);text-transform:uppercase;letter-spacing:.04em;min-height:2.4em;display:flex;align-items:center;justify-content:center;max-width:22ch}
.pscores{width:100%;display:grid;gap:.4rem;margin-top:.6rem}
.pscores div{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem .9rem;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;font-weight:600;font-size:.95rem}
.pscores span{display:inline-flex;align-items:center;gap:.55rem}
.pscores b{font:900 1.3rem/1 var(--fd);letter-spacing:.02em}
.pscores div.mine{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:rgba(255,255,255,.07)}
.plink{background:none;border:0;color:var(--dim);cursor:pointer;font-size:.86rem;margin-top:.4rem;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(1.3rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,15,46,.95);color:#fff;border:1px solid var(--hair);padding:.75rem 1.15rem;border-radius:12px;z-index:100;max-width:92vw;font-size:.9rem;box-shadow:0 16px 50px rgba(0,0,0,.45);animation:pop .2s ease-out}
.loading{display:grid;place-items:center;height:100vh;color:var(--muted)}
.qrbig{background:#fff;border-radius:18px;padding:16px;width:min(300px,70vw);aspect-ratio:1;margin:1.2rem auto}
/* timers */
.clockslot{margin-top:clamp(1.2rem,3vw,2.4rem);min-height:2.8rem}
.clock{display:inline-flex;align-items:center;gap:1rem;padding:.45rem .9rem;border-radius:999px;background:rgba(2,4,24,.4);border:1px solid rgba(255,255,255,.12);cursor:pointer}
.clab{font:800 .95rem/1 var(--fd);text-transform:uppercase;letter-spacing:.08em;color:rgba(230,236,255,.8);min-width:5.5em;text-align:right}
.lights{display:flex;gap:5px}
.lights i{width:clamp(18px,2.4vw,34px);height:clamp(10px,1.2vw,16px);border-radius:4px;background:rgba(255,255,255,.08);transition:background .2s,box-shadow .2s}
.lights i.on{background:var(--cc);box-shadow:0 0 12px var(--cc),inset 0 1px 0 rgba(255,255,255,.5)}
.csec{font:900 1.7rem/1 var(--fd);min-width:1.4em;text-align:left;font-variant-numeric:tabular-nums}
.clock.up{border-color:var(--bad);animation:shake .4s}
.clock.up .clab,.clock.up .csec{color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pclock{width:100%;min-height:2.6rem}
.pbar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold-grad);border-radius:inherit}
.pbar.st i{background:linear-gradient(90deg,#FFC04D,#F07A0C)}
.pct{display:flex;justify-content:space-between;margin-top:.35rem;font-size:.85rem;color:var(--dim)}
.pct b{font:900 1.3rem/1 var(--fd);color:var(--text)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;margin-top:.4rem;transition:opacity .2s}
.tgrid.off{opacity:.35;pointer-events:none}
.tgrid label{display:flex;flex-direction:column;gap:.25rem;font-size:.84rem;color:var(--muted)}
.tgrid .sec{display:flex;align-items:center;gap:.4rem}
.tgrid input{width:4.2rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.45rem .55rem;font-weight:700;color:var(--ink)}
/* suck */
.suckbtn{margin-top:1rem;width:100%;border:0;border-radius:12px;padding:.8rem 1rem;cursor:pointer;font:900 1.35rem/1 var(--fd);text-transform:uppercase;letter-spacing:.06em;color:#fff;
  background:linear-gradient(180deg,#FF5A67,#C8102A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px rgba(220,20,50,.35);animation:pop .3s ease-out}
.suckbtn:hover{filter:brightness(1.1)}
.suckstage{position:relative;height:100%;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;
  background:radial-gradient(70% 70% at 50% 45%,#6A0A1C 0%,#2A0510 60%,#0B0208 100%);box-shadow:0 0 0 1px rgba(255,90,103,.3),0 40px 120px rgba(200,16,42,.25)}
.suckstage.calm{background:radial-gradient(70% 70% at 50% 45%,#1E3FE6 0%,#0A1A7E 55%,#040A36 100%);box-shadow:0 0 0 1px rgba(255,213,83,.25)}
.suckstage.qd.ready{background:radial-gradient(70% 70% at 50% 45%,#5A0A14 0%,#200308 70%)}
.suckstage.qd.go{background:radial-gradient(70% 70% at 50% 45%,#12A85A 0%,#06512B 60%,#022012 100%)}
.suckword{font:900 clamp(4rem,14vw,13rem)/.84 var(--fd);text-transform:uppercase;letter-spacing:.01em;background:linear-gradient(180deg,#FFC7CB 0%,#FF4453 45%,#A30A1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(255,40,60,.45));animation:suckIn .9s cubic-bezier(.2,1.5,.4,1) both,wobble 2.4s 1s ease-in-out infinite}
@keyframes suckIn{0%{opacity:0;transform:scale(3) rotate(-8deg)}60%{opacity:1;transform:scale(.92) rotate(2deg)}80%{transform:translateX(-10px)}90%{transform:translateX(8px)}100%{transform:none}}
@keyframes wobble{50%{transform:rotate(-1.5deg) scale(1.02)}}
.suckans{margin:1.6rem 0 0;font-size:clamp(1rem,1.6vw,1.4rem);color:#FFD1D5}
.suckans b{font:900 1.3em var(--fd);letter-spacing:.03em;color:#fff;text-transform:uppercase}
.sucksub{margin:1.1rem 0 0;font:800 clamp(1.2rem,2.2vw,2rem)/1.2 var(--fd);text-transform:uppercase;letter-spacing:.05em;color:var(--g2)}
.suckhint{margin:1rem 0 0;color:rgba(255,220,225,.7);font-size:.9rem;max-width:60ch}
.btn.dk{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.2);color:#fff}
.btn.dk:hover{background:rgba(0,0,0,.45)}
.btn.ghosty{background:transparent}
.qdword{font:900 clamp(4rem,14vw,12rem)/.9 var(--fd);text-transform:uppercase;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.4)}
.qd.go .qdword{animation:slam .35s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 0 60px rgba(120,255,170,.6),0 6px 0 rgba(0,0,0,.4)}
.qd.ready .qdword{animation:blink 1.4s ease-in-out infinite}
.chip.out{opacity:.8;background:rgba(0,0,0,.35)}
.psuck{font:900 clamp(3rem,16vw,4.4rem)/.85 var(--fd);text-transform:uppercase;background:linear-gradient(180deg,#FFC7CB,#FF4453 45%,#A30A1E);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));animation:suckIn .9s cubic-bezier(.2,1.5,.4,1) both}
.buzzer.wait{color:#FFB3B9;background:radial-gradient(circle at 50% 30%,#8A1B28 0%,#5A0A14 60%,#2E040A 100%);box-shadow:inset 0 -14px 30px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.12)}
.buzzer.go{color:#fff;text-shadow:0 3px 0 rgba(0,60,20,.5);background:radial-gradient(circle at 50% 30%,#8BFFBE 0%,#22D46F 38%,#0E9A4B 74%,#05572A 100%);box-shadow:inset 0 -14px 30px rgba(0,40,15,.45),inset 0 3px 0 rgba(255,255,255,.35)}
.buzzer.go::before{opacity:1}
.ring.go{box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 80px rgba(40,220,120,.5)}
.suckbtn.quiet{background:transparent;color:#FF6B78;border:1px solid rgba(255,90,103,.45);box-shadow:none;font-size:1.05rem;padding:.6rem 1rem;animation:none}
.suckbtn.quiet:hover{background:rgba(255,68,83,.12)}
.suckq{margin:1.8rem 0 .8rem;font-weight:600;color:#FFD1D5}
.suckstage .choose button{font-size:1.05rem;padding:.75rem 1.2rem}
.suckstage .choose button:hover{background:rgba(255,255,255,.12)}
.qdlink{margin-top:1.4rem;background:none;border:0;color:rgba(255,220,225,.65);font-size:.88rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.minigame{margin-top:1.4rem;display:inline-flex;align-items:center;gap:.9rem;font:900 clamp(2rem,4.6vw,4.2rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45);animation:slam .6s .5s cubic-bezier(.2,1.4,.4,1) both}
.minigame b{background:var(--gold-grad);color:#2A1C00;text-shadow:none;padding:.3rem .8rem .25rem;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 10px 30px rgba(255,190,50,.3)}
.suckstage.mg{background:radial-gradient(60% 60% at 50% 42%,#1E3FE6 0%,#0A1A7E 55%,#040A36 100%);box-shadow:0 0 0 1px rgba(255,213,83,.25),0 40px 120px rgba(255,190,50,.12)}
.suckstage.mg::before{content:"";position:absolute;left:50%;top:40%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(from 0deg,rgba(255,213,83,.07) 0deg 5deg,transparent 5deg 12deg);animation:spin 60s linear infinite;pointer-events:none}
.suckstage > *{position:relative}
.mgword{font:900 clamp(4rem,14vw,13rem)/.84 var(--fd);text-transform:uppercase;letter-spacing:.01em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(255,190,50,.35));animation:slam .8s cubic-bezier(.2,1.4,.4,1) both}
.mgval{margin-top:1.2rem;display:inline-flex;align-items:center;gap:.7rem;font:800 clamp(1.4rem,2.6vw,2.4rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.06em;color:rgba(230,236,255,.85)}
.mgval b{font-weight:900;background:var(--gold-grad);color:#2A1C00;padding:.3rem .75rem .25rem;border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.suckstage.mg .suckq{color:#C9D1FF}
.suckstage.mg .suckans{color:#C9D1FF}
.suckstage.mg .qdlink{color:rgba(200,210,255,.6)}
.psuck.mgp{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text}
/* turns */
.turnpick{align-items:center}
.turnpick .tlab{font:800 .95rem/1 var(--fd);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:.3rem}
.turnpick button,.swap button{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.04);border:1px solid var(--hair);color:#DDE2FF;border-radius:9px;padding:.4rem .75rem;font-weight:600;font-size:.84rem;cursor:pointer}
.turnpick button:hover,.swap button:hover{background:rgba(255,255,255,.09)}
.turnpick button.sel{background:var(--gold-grad);color:#2A1C00;border-color:transparent}
.ctrl .hint{margin-right:.4rem}
.swap{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.8rem;padding-top:.7rem;border-top:1px solid var(--hair);font-size:.78rem;color:var(--dim)}
.swap button{padding:.28rem .55rem;font-size:.78rem}

<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);

"use strict";
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);

const rid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },

const COLORS = ["#FFCF4A","#3DDBC8","#FF6F8E","#9D8CFF","#7EE06A","#FF9A3D","#56B8FF","#F0F0F5"];
const money = n => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString();
function toast(msg, ms = 3400) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
const IN_CLAUDE = !!(window.claude && window.claude.use);
const use = n => IN_CLAUDE ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
const PREFIX = "jpyhost-v1-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from({length: 5}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const baseUrl = () => location.href.split("#")[0].split("?")[0];
// Buzzer server: a Firebase Realtime Database relays buzzes over a normal web connection,

// ---------- model ----------
function blankRound(name, base, cats = 5, rows = 5) {
  return { name, cats: Array.from({length: cats}, () => ({ name: "", clues: Array.from({length: rows}, (_, i) => ({ value: base * (i + 1), q: "", a: "", dd: false })) })) };
}
function newGame() {
  return { id: "g" + rid(), title: "Untitled game", updated: Date.now(), useDouble: true, useFinal: true, penalty: true,
    rounds: [blankRound("Jeopardy", 200), blankRound("Double Jeopardy", 400)], final: { cat: "", q: "", a: "" } };
}
function sampleGame() {
  const g = newGame(); g.title = "Sample game"; g.useDouble = false; g.sample = true;
  const data = [
    ["World capitals", [["France's capital, on the Seine","What is Paris?"],["Canada's capital city","What is Ottawa?"],["Australia's planned capital, not Sydney","What is Canberra?"],["Kenya's capital","What is Nairobi?"],["Bhutan's capital, in the Himalayas","What is Thimphu?"]]],
    ["Science", [["Its chemical formula is H2O","What is water?"],["The planet nicknamed the Red Planet","What is Mars?"],["The organelle known as the powerhouse of the cell","What is the mitochondrion?"],["The element with the symbol Fe","What is iron?"],["Light travels about this many kilometres per second in a vacuum","What is 300,000?"]]],
    ["At the movies", [["Pixar film about a rat who cooks in Paris","What is Ratatouille?"],["He directed Jaws and E.T.","Who is Steven Spielberg?"],["1997 film in which Jack and Rose meet at sea","What is Titanic?"],["The Lord of the Rings trilogy was filmed in this country","What is New Zealand?"],["The first animated film nominated for Best Picture","What is Beauty and the Beast?"]]],
    ["Sports", [["The NFL's championship game","What is the Super Bowl?"],["In tennis, a score of zero","What is love?"],["The trophy awarded to the NHL playoff champion","What is the Stanley Cup?"],["Players per side on the ice in hockey, goalie included","What is six?"],["The country with the most men's FIFA World Cup titles","What is Brazil?"]]],
    ["Food & drink", [["The main ingredient in guacamole","What is avocado?"],["Japanese rice wine","What is sake?"],["Spirit distilled from blue agave","What is tequila?"],["Italian pasta whose name means little strings","What is spaghetti?"],["Spice from crocus flowers, the priciest by weight","What is saffron?"]]]
  ];
  data.forEach(([name, clues], c) => { g.rounds[0].cats[c].name = name; clues.forEach(([q, a], i) => Object.assign(g.rounds[0].cats[c].clues[i], { q, a })); });
  g.rounds[0].cats[2].clues[3].dd = true;
  g.final = { cat: "Inventions", q: "In 1876 Alexander Graham Bell received a U.S. patent for this device", a: "What is the telephone?" };

}
const filledCount = g => g.rounds.slice(0, g.useDouble ? 2 : 1).reduce((n, r) => n + r.cats.reduce((m, c) => m + c.clues.filter(x => x.q.trim()).length, 0), 0);

  const parts = [g.useDouble ? "Two rounds" : "One round"];

}

    if (net.mode === "fb") { const old = net.code; fb.send(net.server, `rooms/${old}`, "DELETE").catch(() => {}); net.code = newCode(); LS.set("jp.code", net.code); hostFB(); return; }
    LS.del("jp.code"); openRoom(newCode(), 0);
  },
  editServer() { app.editServer = true; updateLobby(); },
  cancelServer() { app.editServer = false; updateLobby(); },
  saveServer() {
    const v = normServer($("#srvIn").value);
    if (!v) { toast("That doesn't look like a Firebase database URL. It should end in firebaseio.com or firebasedatabase.app."); return; }
    app.server = v; LS.set("jp.server", v); app.editServer = false; hostFB(); toast("Buzzer server saved");
  },
  showCode() { app.modal = { type: "joinCode" }; renderModal(); },
  home() { stopTimer(); app.view = "library"; app.modal = null; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); render(); broadcast(); },
  tab(d) { app.tab = d.k === "final" ? "final" : +d.k; render(); },
  clue(d) { app.modal = { type: "clue", c: +d.c, i: +d.i }; renderModal(); },
  clueNav(d) {
    const r = app.games[app.editId].rounds[app.tab], rows = r.cats[0].clues.length, n = rows * r.cats.length;
    const idx = (app.modal.c * rows + app.modal.i + (+d.d) + n) % n;
    app.modal = { type: "clue", c: Math.floor(idx / rows), i: idx % rows }; renderModal();
  },
  closeModal() { app.modal = null; renderModal(); if (app.view === "editor") renderEditor(); },
  addCat() { const g = app.games[app.editId], r = g.rounds[app.tab]; r.cats.push({ name: "", clues: r.cats[0].clues.map(c => ({ value: c.value, q: "", a: "", dd: false })) }); scheduleSave(g); render(); },
  rmCat() { const g = app.games[app.editId], r = g.rounds[app.tab]; if (r.cats.length > 1) r.cats.pop(); scheduleSave(g); render(); },
  addRow() { const g = app.games[app.editId], r = g.rounds[app.tab], base = r.cats[0].clues[0].value; r.cats.forEach(c => c.clues.push({ value: base * (c.clues.length + 1), q: "", a: "", dd: false })); scheduleSave(g); render(); },
  rmRow() { const g = app.games[app.editId], r = g.rounds[app.tab]; r.cats.forEach(c => { if (c.clues.length > 1) c.clues.pop(); }); scheduleSave(g); render(); },
  setup(d) { app.setupGameId = d.id; app.view = "setup"; app.modal = null; render(); broadcast(); },
  addTeam() { const used = app.teams.map(t => t.color); app.teams.push({ id: "t" + rid(), name: "Team " + (app.teams.length + 1), color: COLORS.find(c => !used.includes(c)) || COLORS[0] }); LS.set("jp.teams", app.teams); renderSetup(); broadcast(); },
  rmTeam(d) { app.teams.splice(+d.i, 1); LS.set("jp.teams", app.teams); renderSetup(); broadcast(); },
  teamColor(d) { const t = app.teams[+d.i]; t.color = COLORS[(COLORS.indexOf(t.color) + 1) % COLORS.length]; LS.set("jp.teams", app.teams); renderSetup(); broadcast(); },
  start() {
    const g = app.games[app.setupGameId];
    if (!filledCount(g)) { toast("This game has no clues yet. Add some in the editor first."); return; }
    if (app.teams.some(t => !t.name.trim())) { toast("Give every team a name."); return; }
    startSession();
  },
  resume() { const s = app.session; if (!s.buzz || !Array.isArray(s.buzz.answered)) s.buzz = freshBuzz(); if (s.ddPenalty === undefined) s.ddPenalty = true; if (!s.tm) s.tm = timerRules(); if (s.clock && s.clock.ends < Date.now()) s.clock = null; app.view = "play"; render(); broadcast(); goFull(); },
  endSession() { app.session = null; saveSession(); render(); broadcast(); },
  full() { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else goFull(); },
  open(d) { openClue(+d.c, +d.i); },
  back() { backToBoard(); },
  reveal() { const s = app.session; s.show = !s.show; saveSession(); const a = $("#ans"); if (a) a.classList.toggle("on", s.show); renderScores(); fitClue(); },
  buzzToggle() { toggleBuzz(); },
  judge(d) { judge(d.t, d.v); },
  adj(d) { applyDelta(d.t, +d.d); saveSession(); renderScores(); broadcast(); },
  ddTeam(d) { app.session.dd.team = d.t; saveSession(); refreshMain(); const w = $("#ddw"); if (w) w.focus(); },
  ddGo(d) {
    const s = app.session, t = teamById(s.dd.team); if (!t) { toast("Pick the team first."); return; }
    const maxW = Math.max(...s.rounds[s.round].cats.flatMap(c => c.clues.map(x => x.value)));
    const max = Math.max(t.score, maxW), w = Math.round(d && d.w !== undefined && !isNaN(d.w) ? +d.w : +($("#ddw") || {}).value);
    if (!(w >= 5 && w <= max)) { toast(`Enter a wager between $5 and ${money(max)}.`); return; }
    s.dd.wager = w; s.phase = "clue"; startClock("dd"); saveSession(); refreshMain(); broadcast();
  },
  signIn() { signIn(); },
  signOut() { signOut(); },
  showRemote() { app.modal = { type: "remote" }; renderModal(); },
  toggleCtrl() { app.showCtrl = !app.showCtrl; updateRemotePill(); },
  removePhoto() { const m = app.modal, g = app.games[app.editId], cl = g.rounds[app.tab].cats[m.c].clues[m.i]; delete cl.img; scheduleSave(g); renderModal(); refreshCard(m.c, m.i); },
  setTurn(d) {
    const s = app.session, t = d.t || null;
    if (s.phase === "board") { s.turn = t; saveSession(); renderScores(); broadcast(); return; }
    if (turnChangeable()) { s.turn = t; giveTurn(t); saveSession(); refreshMain(); broadcast(); }
  },
  suck() {
    const s = app.session; if (!canSuck()) return;
    stopClock(); s.show = false; s.buzz.open = false; s.buzz.token = null; s.buzz.winner = null;
    s.suck = { stage: "intro", value: curClue().value, out: [], winner: null, token: null, readyToken: null, goAt: 0, reason: "" };
    s.phase = "suck"; sadTrombone(); saveSession(); refreshMain(); broadcast();
  },
  suckOwn() { const k = app.session.suck; Object.assign(k, { stage: "intro", token: null, out: [], reason: "" }); saveSession(); refreshMain(); broadcast(); },
  suckReveal() { const s = app.session; s.show = !s.show; saveSession(); refreshMain(); },
  suckQD() {
    const k = app.session.suck;
    Object.assign(k, { stage: "ready", out: [], winner: null, reason: "", token: null, readyToken: rid(), goAt: Date.now() + 2500 + Math.random() * 3500 });
    saveSession(); refreshMain(); broadcast();
  },
  suckAward(d) { const k = app.session.suck; k.winner = { team: d.t, name: "" }; k.stage = "done"; applyDelta(d.t, k.value); saveSession(); refreshMain(); broadcast(); },
  suckUndo() { const k = app.session.suck; if (k.winner) applyDelta(k.winner.team, -k.value); k.winner = null; k.stage = "intro"; saveSession(); refreshMain(); broadcast(); },
  suckNobody() { const k = app.session.suck; k.stage = "done"; k.winner = null; k.reason = "Nobody gets it"; k.token = null; saveSession(); refreshMain(); broadcast(); },
  suckDone() { const s = app.session; s.phase = "clue"; s.suck = null; backToBoard(); },
  stopClock() { stopClock(); saveSession(); renderClock(); broadcast(); },
  nextRound() { app.session.round++; app.intro = true; saveSession(); render(); },
  toFinal() { const s = app.session; s.phase = "final-cat"; s.show = false; saveSession(); render(); broadcast(); },
  finWagers() { app.session.phase = "final-wager"; saveSession(); refreshMain(); },
  finClue() {
    const s = app.session;
    for (const t of s.teams) { const w = +(s.fin.wagers[t.id] || 0), max = Math.max(0, t.score); if (w < 0 || w > max) { toast(`${t.name}'s wager must be between $0 and ${money(max)}.`); return; } }
    s.phase = "final-clue"; s.show = false; saveSession(); refreshMain();
  },
  finJudge(d) { finJudge(d.t, d.v); },
  timer() {
    if (app.timer) { stopTimer(); refreshMain(); return; }
    app.timerLeft = (app.session.tm && app.session.tm.final) || 25;
    app.timer = setInterval(() => {
      app.timerLeft--; const el = $("#timer"); if (el) el.textContent = app.timerLeft > 0 ? app.timerLeft : "Time's up";
      if (app.timerLeft <= 0) { clearInterval(app.timer); app.timer = null; beep(440, .6); renderScores(); }
    }, 1000);
    refreshMain();
  },
  toEnd() { stopTimer(); app.session.phase = "end"; saveSession(); render(); broadcast(); },
  again() { app.setupGameId = app.session.gameId; app.session = null; saveSession(); app.view = "setup"; render(); broadcast(); },
  finish() { app.session = null; saveSession(); app.view = "library"; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); render(); broadcast(); },
  // player
  asPlayer() { app.role = "player"; app.needCode = true; $("#app").innerHTML = ""; renderPlayer(); },
  enterCode() {
    const c = ($("#pcode").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length !== 5) { toast("Room codes are 5 characters."); return; }
    startPlayerWithCode(c);
  },
  changeCode() { if (net.peer) { try { net.peer.destroy(); } catch {} } if (net.fbListen) net.fbListen.close(); net.mode = null; app.hostState = null; app.needCode = true; $("#app").innerHTML = ""; renderPlayer(); },
  pickTeam(d) { app.me.team = d.t; LS.set("jp.player", app.me); renderPlayer(); },
  join() {
    const name = cleanName($("#pname").value);
    if (!name) { toast("Type your name first."); return; }
    if (!app.hostState) { toast("Still connecting to the game. Hang on a second."); return; }
    if (!app.hostState.teams.some(t => t.id === app.me.team)) { toast("Tap your team above first."); return; }
    app.me.name = name; app.me.joined = true; LS.set("jp.player", app.me);
    playerSend({ t: "hello", name, team: app.me.team });
    $("#app").innerHTML = ""; renderPlayer();
  },
  leaveTeam() { app.me.joined = false; LS.set("jp.player", app.me); playerSend({ t: "bye" }); $("#app").innerHTML = ""; renderPlayer(); }
};
function copyText(text, ok) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok))
    .catch(() => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); toast(ok); } catch { toast("Couldn't copy. Select it and copy by hand."); } t.remove(); });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "closeModal" && !b.dataset.force && e.target !== b) return;
  if (actions[act]) actions[act](b.dataset, b, e);
  if (app.view === "play" && app.role === "host" && document.activeElement && document.activeElement.blur) document.activeElement.blur();
});
document.addEventListener("pointerdown", e => {
  if (e.target.closest("#buzzer")) { e.preventDefault(); doBuzz(app.pLive && app.pLive.qd ? "qd" : (app.hostState && app.hostState.kind) || "buzz"); }
  else if (e.target.closest("#steal")) { e.preventDefault(); doBuzz("steal"); }
});
document.addEventListener("input", e => {
  const el = e.target, bind = el.dataset && el.dataset.bind; if (!bind) return;
  if (bind.startsWith("rule.")) {
    const k = bind.slice(5);
    if (el.type === "checkbox") { app.rules[k] = el.checked; const tg = $("#timerGrid"); if (k === "timers" && tg) tg.classList.toggle("off", !el.checked); }
    else app.rules[k] = Math.max(1, Math.min(120, Math.round(+el.value) || 1));
    LS.set("jp.rules", app.rules); cloudSaveSettings(); return;
  }
  if (bind === "teamName") { app.teams[+el.dataset.i].name = el.value; LS.set("jp.teams", app.teams); broadcast(); clearTimeout(app.setT); app.setT = setTimeout(cloudSaveSettings, 800); return; }
  if (bind === "ddWager") { app.session.dd.wager = +el.value || 0; saveSession(); return; }
  if (bind === "finWager") { app.session.fin.wagers[el.dataset.t] = el.value === "" ? "" : +el.value; saveSession(); return; }
  const g = app.games[app.editId]; if (!g) return;
  if (bind === "title") g.title = el.value;
  else if (bind === "cat") g.rounds[app.tab].cats[+el.dataset.c].name = el.value;
  else if (bind.startsWith("final.")) g.final[bind.slice(6)] = el.value;
  else if (["useDouble", "useFinal", "penalty"].includes(bind)) { g[bind] = el.checked; scheduleSave(g); renderEditor(); return; }
  else if (bind.startsWith("clue.")) {
    const m = app.modal, cl = g.rounds[app.tab].cats[m.c].clues[m.i], f = bind.slice(5);
    cl[f] = f === "dd" ? el.checked : f === "value" ? (Math.max(0, Math.round(+el.value)) || 0) : el.value;
    refreshCard(m.c, m.i);
  }
  scheduleSave(g);
});
document.addEventListener("change", e => {
  if (e.target.id === "photoIn" && e.target.files && e.target.files[0]) { attachPhoto(e.target.files[0]); return; }
  if (e.target.dataset.actChange === "turnMode") { app.rules.turnMode = e.target.value; LS.set("jp.rules", app.rules); return; }
  if (e.target.dataset.actChange === "values") {
    const g = app.games[app.editId], base = +e.target.value;
    g.rounds[app.tab].cats.forEach(c => c.clues.forEach((cl, i) => cl.value = base * (i + 1)));
    scheduleSave(g); render();
  }
});
document.addEventListener("dragover", e => { if (e.target.closest && e.target.closest("#photoDrop")) { e.preventDefault(); e.target.closest("#photoDrop").classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#photoDrop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#photoDrop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) attachPhoto(f); });
document.addEventListener("paste", e => {
  if (!app.modal || app.modal.type !== "clue") return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); attachPhoto(item.getAsFile()); }
});
document.addEventListener("keydown", e => {
  if (app.role === "player") {
    if (e.key === "Enter" && $("#pcode") && document.activeElement === $("#pcode")) actions.enterCode();
    else if (e.code === "Space" && app.pLive && (app.pLive.buzz || app.pLive.steal || app.pLive.qd)) { e.preventDefault(); doBuzz(app.pLive.qd ? "qd" : (app.hostState && app.hostState.kind) || "buzz"); }
    return;
  }
  if (e.key === "Escape" && app.modal) { actions.closeModal(); return; }
  if (app.view !== "play" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const s = app.session; if (!s) return;
  if (e.code === "Space" && s.phase === "suck") { e.preventDefault(); actions.suckReveal(); }
  else if (e.code === "Space" && (s.phase === "clue" || s.phase === "final-clue")) { e.preventDefault(); actions.reveal(); }
  else if (e.key.toLowerCase() === "b" && s.phase === "clue") toggleBuzz();
  else if (e.key === "Escape" && s.phase === "clue") backToBoard();
});
window.addEventListener("pagehide", () => { if (app.role === "player" && net.mode === "p2p") playerSend({ t: "bye" }); });

// ---------- boot ----------
(async function boot() {
  const m = /[#&?]join=([A-Za-z0-9]{5})/.exec(location.hash + location.search);
  if (!IN_CLAUDE) {
    app.server = normServer(LS.get("jp.server", "") || DEFAULT_SERVER);
    const sm = /[#&?]s=([A-Za-z0-9.-]+)/.exec(location.hash + location.search);
    if (m) { app.role = "player"; startPlayerWithCode(m[1].toUpperCase(), sm ? sm[1] : ""); return; }
    if (/[#?]join\b/.test(location.hash + location.search)) { app.role = "player"; app.needCode = true; renderPlayer(); return; }
    if (/[#?]remote\b/.test(location.hash + location.search)) { app.role = "remote"; renderRemote(); cloudInit(); return; }
    app.role = "host";
    cloudInit();
    if (!Object.keys(app.games).length && !LS.get("jp.seeded", false)) { const g = sampleGame(); app.games[g.id] = g; persistLocal(); LS.set("jp.seeded", true); }
    setSync("Saved in this browser");
    startHostNet(); render();
    return;
  }
  const [user, room, db] = await Promise.all([use("user"), use("room"), use("db")]);
  let host = true;
  if (m || /buzz/i.test(location.hash)) host = false;
  else if (user) { try { host = await user.canEdit(); } catch { host = true; } }
  app.role = host ? "host" : "player";
  if (!host) { if (room) playerRoom(room); else renderPlayer(); return; }
  if (!Object.keys(app.games).length && !LS.get("jp.seeded", false)) { const g = sampleGame(); app.games[g.id] = g; persistLocal(); LS.set("jp.seeded", true); }
  if (room) hostRoom(room);
  render();
  if (db && user) {
    try {
      const id = await user.id();
      if (id) {
        app.col = db.collection("data/users/" + id);
        const snap = await app.col.get(), remote = {};
        snap.docs.forEach(d => { const g = d.data(); if (g && g.id && Array.isArray(g.rounds)) remote[g.id] = clone(g); });
        for (const [gid, g] of Object.entries(remote)) if (!app.games[gid] || app.games[gid].updated < g.updated) app.games[gid] = g;
        persistLocal();
        for (const [gid, g] of Object.entries(app.games)) if (!remote[gid] || remote[gid].updated < g.updated) flush(gid);
        setSync("Saved to your account");
        if (app.view === "library") render();
      }
    } catch { setSync("Saved on this device only"); }
  } else setSync("Saved on this device");
})();
</script>
